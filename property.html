<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#173b31">
    <title>Property | Aurevia</title>
    <link rel="stylesheet" href="aurevia.css">
    <link rel="stylesheet" href="app.css">
    <script type="module" src="js/property-page.js"></script>
</head>
<body class="app-body">
    <a class="skip-link" href="#property-main">Skip to content</a>
    <header class="app-header"><a class="brand" href="index.html" aria-label="Aurevia home"><span class="brand-name">AUREVIA<span class="brand-dot">.</span></span><span class="brand-tagline">Your space, Your future</span></a><a class="app-back-link" href="index.html#homes">Back to properties</a></header>
    <main class="property-detail-shell" id="property-main">
        <p class="app-message" id="property-message" role="status" aria-live="polite">Loading property details…</p>
        <article id="property-detail" hidden>
            <div class="property-detail-heading"><div><p class="eyebrow" id="property-type-label"></p><h1 id="property-title"></h1><p id="property-location"></p></div><div class="property-detail-price" id="property-price"></div></div>
            <div class="property-gallery" id="property-gallery"></div>
            <div class="property-detail-columns"><section><h2>About this property</h2><p id="property-description"></p><div class="property-facts" id="property-facts"></div><h2>Amenities</h2><ul id="property-amenities"></ul></section><aside class="property-contact"><p class="eyebrow">Listed by</p><h2 id="contact-name"></h2><p id="contact-phone"></p><a id="contact-link" class="dashboard-button" rel="noopener noreferrer">Contact owner / agent</a><p class="review-note-detail">Published after Aurevia review</p></aside></div>
        </article>
    </main>
</body>
</html>
